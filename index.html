/div></footer><audio id="bell" src="assets/quiet-bell.wav" preload="none"></audio><script type="module">const slides=await fetch('reference-exports/slides.json').then(r=>{if(!r.ok)throw Error('Slides unavailable');return r.json()});const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let index=Math.max(0,Math.min(7,Number(location.hash.slice(1)||1)-1)),audio=false;const exportMode=new URLSearchParams(location.search).has('export');document.body.classList.toggle('export',exportMode);function size(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1920,innerHeight/1080))}size();addEventListener('resize',size);function render(){const s=slides[index];$('#frame').innerHTML='<section class="slide" data-id="'+esc(s.id)+'" aria-label="Slide '+(index+1)+'"><div class="visual"><img src="'+esc(s.image)+'" alt="Illustrative Krampus or Alpine imagery; not archival evidence"></div><div class="shade"></div><div class="fog"></div><div class="copy"><h1>'+s.title.split('|').map(t=>'<span>'+esc(t)+'</span>').join('')+'</h1>'+(s.subtitle?'<p class="sub">'+esc(s.subtitle)+'</p>':'')+'</div>'+(s.id==='economy'?'<div class="chain"><span>Krampuslauf</span><span>Cultural interest</span><span>Visitors</span><span>Local businesses</span></div>':'')+'<span class="credit">Illustrative visual</span></section>';$('#counter').textContent=String(index+1).padStart(2,'0')+' / 08';$('#prev').disabled=index===0;$('#next').disabled=index===7;$('#video').hidden=index!==0;$('#dots').innerHTML=slides.map((s,i)=>'<button aria-label="Slide '+(i+1)+': '+esc(s.title.replaceAll('|',' '))+'" aria-current="'+(i===index)+'" data-slide="'+i+'"></button>').join('')}function go(n){index=Math.max(0,Math.min(7,n));history.replaceState(null,'','#'+(index+1));render()}function settle(){document.querySelector('.slide')?.classList.add('settled');document.getAnimations().forEach(a=>{try{a.finish()}catch{a.cancel()}})}function advance(){if($('#film')){$('#film').remove();return}if(document.getAnimations().some(a=>a.playState==='running'&&a.effect?.getTiming().iterations!==Infinity)){settle();return}go(index+1)}function film(){if(index!==0)return;if($('#film')){$('#film').remove();return}settle();const v=document.createElement('video');v.id='film';v.src='assets/mask-removal.mp4';v.muted=!audio;v.volume=.15;v.playsInline=true;v.onended=()=>v.remove();v.onerror=()=>v.remove();$('#frame').append(v);v.play().catch(()=>v.remove())}$('#next').onclick=advance;$('#prev').onclick=()=>go(index-1);$('#dots').onclick=e=>{if(e.target.dataset.slide!==undefined)go(Number(e.target.dataset.slide))};$('#frame').onclick=advance;$('#video').onclick=film;$('#audio').onclick=()=>{audio=!audio;$('#audio').textContent=audio?'Audio on':'Audio off';$('#audio').setAttribute('aria-pressed',String(audio));if($('#film'))$('#film').muted=!audio;if(audio){$('#bell').volume=.15;$('#bell').play().catch(()=>{})}else{$('#bell').pause();$('#bell').currentTime=0}};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();advance()}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(7);if(e.key.toLowerCase()==='f')$('#fullscreen').click();if(e.key.toLowerCase()==='m')$('#audio').click();if(e.key.toLowerCase()==='v')film();if(e.key==='Escape'){$('#film')?.remove();settle()}});render();</script></body></html>
